# Overlay LEGACY: Caddy embebido con ports 80/443.
# En Lyntrix NO uses esto — el proxy central en proxy_net usa deploy/Caddyfile.
# Preferí: docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#
# Solo para labs aislados sin Caddy compartido:
#   docker compose -f docker-compose.yml -f deploy/compose.caddy.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.standalone:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    networks:
      - lyntrix_network

volumes:
  caddy_data:
  caddy_config:
